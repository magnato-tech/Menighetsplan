<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <meta charset="UTF-8" />
    <title>Menighetsplan — API</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 40rem;
        margin: 2rem auto;
        color: #1e293b;
        line-height: 1.5;
      }
      code {
        background: #f1f5f9;
        padding: 0.1rem 0.35rem;
        border-radius: 0.25rem;
      }
      pre {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        padding: 1rem;
        overflow: auto;
        font-size: 0.8rem;
      }
      button {
        background: #2d5a3f;
        color: #fff;
        border: 0;
        padding: 0.5rem 1rem;
        border-radius: 0.5rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>Menighetsplan</h1>
    <p>
      Dette er API-backend mot Google Sheets. Selve planleggeren er React-appen,
      ikke denne siden.
    </p>
    <p>JSON-last: <code>?action=load</code> &nbsp; Status: <code>?action=ping</code></p>
    <p>
      <button type="button" onclick="testLoad()">Test lasting fra arket</button>
    </p>
    <pre id="out">Klikk knappen for å verifisere tilkobling.</pre>
    <script>
      function testLoad() {
        var out = document.getElementById("out");
        out.textContent = "Laster …";
        google.script.run
          .withSuccessHandler(function (data) {
            out.textContent = JSON.stringify(
              {
                personer: data.personer.length,
                grupper: data.grupper.length,
                roller: data.roller.length,
                gudstjenester: data.gudstjenester.length,
                tildelinger: data.tildelinger.length,
                svar: data.svar.length,
              },
              null,
              2
            );
          })
          .withFailureHandler(function (err) {
            out.textContent = String(err && err.message ? err.message : err);
          })
          .loadDatabase();
      }
    </script>
  </body>
</html>
